
{% extends "base.html" %}

{% block title %}Вхід адміністратора — Red Notice{% endblock %}

{% block content %}
<section class="login-wrap">
    <div class="login-card">
        <div class="login-symbol">R</div>
        <span class="eyebrow">RESTRICTED ACCESS · DEMO</span>
        <h1>Вхід адміністратора</h1>
        <p>Авторизуйтеся для керування демонстраційними анкетами.</p>

        <form method="POST" class="login-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="field">
                <label for="username">Логін</label>
                <input id="username" name="username" required
                       autocomplete="username">
            </div>

            <div class="field">
                <label for="password">Пароль</label>
                <input id="password" type="password" name="password" required
                       autocomplete="current-password">
            </div>

            <button class="btn btn-primary btn-block" type="submit">
                Увійти до системи →
            </button>
        </form>
    </div>
</section>
{% endblock %}
